<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dylan Miller | Resume</title>
<style>
* {
box-sizing: border-box;
}
body {
margin: 0;
background: #f5f5f5;
color: #111;
font-family: Arial, Helvetica, sans-serif;
line-height: 1.35;
}
.resume {
width: 8.5in;
min-height: 11in;
margin: 30px auto;
padding: 0.45in 0.55in;
background: white;
box-shadow: 0 2px 12px rgba(0,0,0,0.12);
}
/* HEADER */
.header {
text-align: center;
margin-bottom: 10px;
}
.name {
font-size: 26px;
font-weight: 700;
letter-spacing: 0.5px;
margin-bottom: 4px;
}
.contact {
font-size: 10.5px;
color: #333;
}
.contact a {
color: #111;
text-decoration: none;
}
.contact a:hover {
text-decoration: underline;
}
/* SECTIONS */
.section {
margin-top: 9px;
}
.section-title {
font-size: 12px;
font-weight: 700;
letter-spacing: 1px;
border-bottom: 1.5px solid #111;
padding-bottom: 2px;
margin-bottom: 5px;
}
/* EDUCATION / EXPERIENCE */
.entry {
margin-bottom: 6px;
}
.entry-header {
display: flex;
justify-content: space-between;
align-items: baseline;
gap: 10px;
}
.entry-title {
font-size: 10.5px;
font-weight: 700;
}
.entry-date {
font-size: 9.5px;
white-space: nowrap;
text-align: right;
}
.entry-subtitle {
display: flex;
justify-content: space-between;
align-items: baseline;
gap: 10px;
font-size: 9.5px;
font-style: italic;
}
.entry-location {
white-space: nowrap;
text-align: right;
font-style: normal;
}
ul {
margin: 2px 0 0 16px;
padding: 0;
}
li {
font-size: 9.3px;
margin-bottom: 2px;
padding-left: 1px;
}
/* PROFESSIONAL DEVELOPMENT */
.development {
font-size: 9.5px;
margin-top: 2px;
}
.development strong {
font-weight: 700;
}
/* LINKS */
.portfolio-link {
color: #111;
text-decoration: none;
}
.portfolio-link:hover {
text-decoration: underline;
}
/* PRINT */
@media print {
body {
background: white;
}
.resume {
width: 8.5in;
min-height: 11in;
margin: 0;
padding: 0.45in 0.55in;
box-shadow: none;
}
@page {
size: Letter;
margin: 0;
}
}
/* MOBILE */
@media screen and (max-width: 900px) {
.resume {
width: 95%;
min-height: auto;
margin: 15px auto;
padding: 25px;
}
.entry-header,
.entry-subtitle {
flex-direction: column;
gap: 0;
}
.entry-date,
.entry-location {
text-align: left;
}
}
</style>
</head>
<body>
<main class="resume">
